version: '3.8'

services:
  # 1. Base de données PostgreSQL + Extension Vector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: it_hub_postgres
    restart: always
    env_file:
      - .env
    environment:
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Service Ollama pour l'IA (Qwen)
  ollama:
    image: ollama/ollama:0.4.7
    container_name: it_hub_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 3. Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_hub_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  

volumes:
  postgres_data:
  ollama_data: